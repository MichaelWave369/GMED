name: GMED Evidence Gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: syntax-tests-and-static-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check reference-app.js
          node --check src/startrace-r8-verify.js
          node --check scripts/startrace-r8-export.mjs
          node --check scripts/startrace-r8-verify.mjs
          node --check stress-app.js
          node --check src/startrace-integrators.js
          node --check src/startrace-r7.js
          node --check scripts/startrace-gravity-audit.mjs
          node --check validate-app.js
          node --check src/startrace-validation.js
          node --check scripts/startrace-validate-horizons.mjs
          node --check scripts/startrace-source-audit.mjs
          node --check precision-app.js
          node --check src/startrace-horizons.js
          node --check src/startrace-precision.js
          node --check flyby-app.js
          node --check src/startrace-flyby.js
          node --check skytrace-app.js
          node --check src/startrace-sky.js
          node --check startrace-app.js
          node --check src/startrace.js
          node --check scripts/startrace.mjs
          node --check app.js
          node --check src/verifier.js
          node --check src/github.js
          node --check src/ouroboros.js
          node --check scripts/ouroboros.mjs
          node --check scripts/gmed.mjs
      - name: Run deterministic regression tests
        run: node --test tests/*.test.mjs
      - name: Audit source-derived Horizons vector pair
        run: npm run horizons-audit > /dev/null
      - name: Validate 30-minute withheld ephemeris samples
        run: npm run horizons-validate > /dev/null
      - name: Audit comet gravity integrator convergence
        run: npm run gravity-audit > /dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned reference solver
        run: python -m pip install -r requirements-r8.txt
      - name: Verify independent SciPy DOP853 solver reference
        run: |
          python -m py_compile scripts/startrace-r8-scipy.py
          node scripts/startrace-r8-export.mjs > /tmp/gmed-r8-case.json
          python scripts/startrace-r8-scipy.py /tmp/gmed-r8-case.json /tmp/gmed-r8-scipy.json
          node scripts/startrace-r8-verify.mjs /tmp/gmed-r8-case.json /tmp/gmed-r8-scipy.json > /tmp/gmed-r8-report.json
      - name: Validate static entry points
        run: |
          test -s reference.html
          test -s reference.css
          test -s reference-app.js
          grep -q 'id="plot"' reference.html
          test -s docs/STARTRACE_SCIPY_R8.md
          test -s requirements-r8.txt
          test -s stress.html
          test -s stress.css
          test -s stress-app.js
          test -s docs/STARTRACE_GRAVITY_R7.md
          grep -q 'id="stressPlot"' stress.html
          test -s validate.html
          test -s validate.css
          test -s validate-app.js
          grep -q 'id="modePosition"' validate.html
          test -s docs/STARTRACE_HORIZONS_R6.md
          test -s data/horizons-5bce/earth-399-30min-extract.txt
          test -s data/horizons-5bce/moon-301-30min-extract.txt
          test -s data/horizons-5bce/heldout-manifest.json
          test -s data/horizons-5bce/manifest.json
          test -s data/horizons-5bce/earth-399-extract.txt
          test -s data/horizons-5bce/moon-301-extract.txt
          test -s docs/STARTRACE_HORIZONS_R5.md
          grep -q 'id="loadSnapshot"' precision.html
          test -s precision.html
          test -s precision.css
          test -s docs/STARTRACE_EPHEMERIS_R4.md
          grep -q 'src="./precision-app.js"' precision.html
          test -s flyby.html
          test -s flyby.css
          test -s docs/STARTRACE_FLYBY_R3.md
          grep -q 'src="flyby-app.js"' flyby.html
          test -s skytrace.html
          test -s skytrace.css
          test -s docs/STARTRACE_SKY_R2.md
          grep -q 'src="./skytrace-app.js"' skytrace.html
          test -s startrace.html
          test -s startrace.css
          test -s docs/STARTRACE_5.md
          grep -q 'src="./startrace-app.js"' startrace.html
          test -s index.html
          test -s styles.css
          test -s favicon.svg
          test -s src/ouroboros.js
          grep -q 'id="ouroboros"' index.html
          test -s LICENSE
          grep -q 'type="module" src="app.js"' index.html
          grep -q 'id="verify-form"' index.html
          grep -q 'MERGED IS A CLAIM' index.html
