name: Publish GMED

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gmed-pages
  cancel-in-progress: true

jobs:
  build:
    name: test-and-stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no false green states
        run: node --test tests/*.test.mjs
      - name: Stage exact static artifact
        run: |
          mkdir -p _site/src _site/docs
          cp index.html app.js styles.css favicon.svg startrace.html startrace.css startrace-app.js skytrace.html skytrace.css skytrace-app.js flyby.html flyby.css flyby-app.js _site/
          cp src/verifier.js src/github.js src/ouroboros.js src/startrace.js src/startrace-sky.js src/startrace-flyby.js _site/src/
          cp docs/STARTRACE_5.md docs/STARTRACE_SKY_R2.md docs/STARTRACE_FLYBY_R3.md _site/docs/
          test -s _site/flyby.html
          test -s _site/src/startrace-flyby.js
          test -s _site/skytrace.html
          test -s _site/src/startrace-sky.js
          test -s _site/startrace.html
          test -s _site/src/startrace.js
          test -s _site/index.html
          test -s _site/src/verifier.js
          test -s _site/src/ouroboros.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    name: deploy-pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
